name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Offline demo (no network, all three delivery modes)
        run: node dist/cli.js demo --once --server-port 0 --no-color
      - name: Committed dist/ matches the sources
        run: |
          npm run build
          git diff --exit-code -- dist/ || { echo "::error::dist/ is stale: run npm run build and commit it"; exit 1; }
